[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yaconfiglib"
version = "0.11.2"
authors = [{ name = "Jose A" }]
description = "Another Config lib for python, basically load config/yaml/toml/... files and add some features like relative import and templating."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "pathlib-next>=0.9.0,<0.10"
]

[project.optional-dependencies]
toml = ["tomli>=2.0,<3; python_version < '3.11'"]
yaml = ["pyyaml"]
transform = ["yaconfiglib[jinja2]"]
jinja2 = ["jinja2"]
dev = ["pytest", "build", "hatchling", "twine", "black"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[project.urls]
Homepage = "https://github.com/jose-pr/yaconfiglib/"
Documentation = "https://jose-pr.github.io/yaconfiglib/"
Issues = "https://github.com/jose-pr/yaconfiglib/issues"


# Ship the consumer-facing docs inside the installed package, so they are
# readable from site-packages via importlib.resources without the repo.
# src/yaconfiglib/AGENTS.md is included automatically by living in the package
# dir; the repo-root AGENTS.md is development-only and deliberately not
# shipped.
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "yaconfiglib/README.md"

# Each target needs its OWN exclude list: hatchling reads
# tool.hatch.build.targets.<target>.exclude instead of tool.hatch.build.exclude
# whenever the target defines one, so a global "*.local.*" would not reach these.
[tool.hatch.build.targets.sdist]
exclude = ["/.*", "/benchmarks", "*.local.*"]

[tool.hatch.build.targets.wheel]
packages = ["src/yaconfiglib"]
exclude = ["*.local.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Pinned to the project's MINIMUM supported Python so black never emits syntax
# the floor cannot parse.
[tool.black]
target-version = ["py39"]

